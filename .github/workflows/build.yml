name: Build Zentra Clip APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar keystore de release (apenas na primeira build)
        run: |
          if [ ! -f app/zentra-release.keystore ]; then
            keytool -genkeypair -v -keystore app/zentra-release.keystore -alias zentra \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass zentraclip2026 -keypass zentraclip2026 \
              -dname "CN=Zentra Clip, OU=Zentra, O=Zentra, L=SaoPaulo, ST=SP, C=BR"
          fi

      - name: Compilar APKs (release + debug)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 | tee /tmp/build.log | tail -250

      - name: Publicar log de erro no repo (para depuração)
        if: failure() && github.ref_type == 'branch'
        run: |
          cp /tmp/build.log build-error.log 2>/dev/null || echo "log indisponivel" > build-error.log
          tail -400 build-error.log > build-error-tail.log
          mv build-error-tail.log build-error.log
          git config user.name "arena-ai-coding-agent"
          git config user.email "agent@arena.ai"
          git add build-error.log
          git commit -m "ci: log de erro de build [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload dos APKs
        uses: actions/upload-artifact@v4
        with:
          name: Zentra-Clip-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload do keystore (backup)
        uses: actions/upload-artifact@v4
        with:
          name: zentra-release-keystore
          path: app/zentra-release.keystore
          if-no-files-found: error

      - name: Versionar keystore no repo (assinatura estável)
        if: success() && github.ref_type == 'branch'
        run: |
          git config user.name "arena-ai-coding-agent"
          git config user.email "agent@arena.ai"
          git add app/zentra-release.keystore
          if git diff --cached --quiet; then
            echo "keystore já versionado"
          else
            git commit -m "ci: versionar keystore de release [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Anexar APKs à release (em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
